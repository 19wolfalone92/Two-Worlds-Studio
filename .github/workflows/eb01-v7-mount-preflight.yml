name: EB01 V7 - CPU private Kaggle kernel-input mount proof (ZERO GPU)

on:
  push:
    branches: ["production/elizabeth-bones-full-native-v7-20261112"]
    paths: ["ops/eb01_v7_mount_preflight.trigger"]

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-account
  cancel-in-progress: false

jobs:
  preflight_no_gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Kaggle CLI only, no video models or GPU
        run: |
          python -m pip install -q 'kaggle>=2.2.4' 'six>=1.16,<2'
          python -m py_compile tools/kaggle_eb01_v7_mount_preflight.py
      - name: Prepare and submit one CPU private kernel with source mounts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import json, hashlib,os
          workspace=Path(os.environ["RUNNER_TEMP"])/"eb01-v7-mount-worker"
          workspace.mkdir()
          original=Path("tools/kaggle_eb01_v7_mount_preflight.py")
          (workspace/"kernel_main.py").write_bytes(original.read_bytes())
          slug="eb01-v7-mount-"+hashlib.sha256(os.environ["GITHUB_RUN_ID"].encode()).hexdigest()[:12]
          metadata={
             "id":os.environ["KAGGLE_USERNAME"]+"/"+slug,
             "title":slug,"code_file":"kernel_main.py","language":"python",
             "kernel_type":"script","is_private":"true","enable_gpu":"false",
             "enable_internet":"false","dataset_sources":[],
             "competition_sources":[],
             "kernel_sources":[
                "wolf19loner92/eb01-v6-canon-adad762a9834",
                "wolf19loner92/eb01-v6-photoreal-e140674dabc5",
                "wolf19loner92/tw-elizabeth-native-02233574da68"
             ],"model_sources":[]}
          (workspace/"kernel-metadata.json").write_text(json.dumps(metadata,indent=2))
          with open(os.environ["GITHUB_ENV"],"a") as f:
             f.write("V7_READONLY_KERNEL="+metadata["id"]+"\n")
          print("PRIVATE_CPU_SOURCE_MOUNT_SUBMIT",metadata["id"],"three mounted sources")
          PY
          kaggle kernels push -p "$RUNNER_TEMP/eb01-v7-mount-worker" --timeout 1500
      - name: Poll exact CPU notebook (never launch GPU)
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_api poll --kernel "$V7_READONLY_KERNEL" --timeout 650 --interval 35
      - name: Read only SHA/count receipt, no private media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          kaggle kernels output "$V7_READONLY_KERNEL" -p "$RUNNER_TEMP/proof" --force
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"proof"/"EB01_V7_MOUNT_READONLY.json"
          result=json.loads(p.read_text())
          assert result["status"]=="ALL_THREE_PRIVATE_OUTPUTS_MOUNTED_AND_SHA_VERIFIED", result
          assert len(result["voices"])==6
          assert result["gpu_executed"] is False
          print("THREE_PRIVATE_ORIGINAL_OUTPUTS_MOUNTED_SHA_PASS_AUDIO_COUNT_6")
          PY
      - name: On failure inspect same CPU job only
        if: failure()
        shell: bash
        run: |
          if [[ -n "${V7_READONLY_KERNEL:-}" ]]; then
            kaggle kernels status "$V7_READONLY_KERNEL" || true
            kaggle kernels output "$V7_READONLY_KERNEL" -p "$RUNNER_TEMP/proof" --force || true
            cat "$RUNNER_TEMP/proof/EB01_V7_MOUNT_READONLY.json" || true
          fi
          echo "::notice::CPU-only preflight failure, no GPU consumed."
      - name: Clean read-only state
        if: always()
        run: rm -rf "$RUNNER_TEMP/eb01-v7-mount-worker" "$RUNNER_TEMP/proof"
