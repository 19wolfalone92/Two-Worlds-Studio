name: T-FLEX V9 — classified TWO Kaggle account auth (NO GPU)
on:
  push:
    branches: ["research/tflex-v9-dual-kaggle-preflight-20261120"]
    paths:
      - ops/tflex_v9_kaggle_auth_diagnostics.py
      - .github/workflows/tflex-v9-dual-kaggle-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  read-only-private-token-check:
    name: Kaggle account ${{ matrix.account }} auth only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2]
    env:
      KAGGLE_API_TOKEN: ${{ matrix.account == 1 && secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_API_TOKEN2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip -q install "kaggle>=2.2.4" "kagglehub>=1.0.2"
      - name: One authorized read-only request; fail if unauthorized
        env:
          TFLEX_KAGGLE_DIAGNOSTIC_REPORT: ${{ runner.temp }}/tflex-kaggle-account-${{ matrix.account }}-safe.json
        run: |
          set -euo pipefail
          python ops/tflex_v9_kaggle_auth_diagnostics.py
      - name: Safe classification only (no original artwork or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TFLEX_KAGGLE_ACCOUNT_${{ matrix.account }}_SAFE_AUTH_STATUS
          path: ${{ runner.temp }}/tflex-kaggle-account-${{ matrix.account }}-safe.json
          retention-days: 3
          if-no-files-found: warn
