name: FREEVIDEO - diagnose existing Kaggle I2V failure (READ ONLY)
on:
  push:
    branches:
      - research/freevideo-t4-adaptive-20261123
    paths:
      - '.github/workflows/freevideo-kaggle-failure-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose-failed-private-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KERNEL_SLUG: freevideo-hybrid-1595d9d64e95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested Kaggle client only, no model or GPU
        run: python -m pip install -q 'kaggle==2.2.4' 'six>=1.16,<2'
      - name: Resolve username (not printed)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV" > /dev/null
      - name: Download only job receipt (never media/source/log)
        id: readback
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freevideo_failed_readback"
          # The private kernel already ran and ERRORed. This is a read-only request.
          kaggle kernels output "$KAGGLE_USERNAME/$KERNEL_SLUG" \
            -p "$RUNNER_TEMP/freevideo_failed_readback" \
            --file-pattern '^freevideo_result[.]json$' --page-size 200 \
            > "$RUNNER_TEMP/freevideo_readback_cli_stdout.txt" \
            2> "$RUNNER_TEMP/freevideo_readback_cli_stderr.txt"
          echo 'FREEVIDEO_PRIVATE_DIAG_RESULT_DOWNLOADED_NO_GPU'
      - name: Emit only allowlisted error TYPE, no strings, private paths or media
        if: always()
        shell: bash
        env:
          READBACK_STATUS: ${{ steps.readback.outcome }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d = Path(os.environ['RUNNER_TEMP']) / 'freevideo_failed_readback'
          receipts = list(d.rglob('freevideo_result.json'))
          print('FREEVIDEO_PRIOR_GPU_JOB_STATUS=ERROR')
          print('FREEVIDEO_DIAGNOSTIC_READBACK=' + ('AVAILABLE' if len(receipts)==1 else 'UNAVAILABLE'))
          if len(receipts)!=1:
              print('FREEVIDEO_DIAGNOSTIC_LIMITATION=NO_RECEIPT_OR_READBACK_FAILED')
          else:
              try:
                  r = json.loads(receipts[0].read_text(encoding='utf-8'))
                  if not isinstance(r,dict): raise ValueError('not object')
                  status = str(r.get('status','UNKNOWN'))
                  kind = str(r.get('error_type','UNKNOWN'))
                  if not re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,80}',kind): kind = 'REDACTED'
                  if status not in ('BLOCKED_GPU_NOT_VERIFIED','REAL_GPU_PREVIEW_REVIEW_REQUIRED'):
                      status = 'UNKNOWN'
                  print('FREEVIDEO_WORKER_RECEIPT_STATUS=' + status)
                  print('FREEVIDEO_WORKER_ERROR_CLASS=' + kind)
                  print('FREEVIDEO_NEURAL_PREVIEW=' + (
                      'CLAIMED_NOT_VERIFIED' if status=='REAL_GPU_PREVIEW_REVIEW_REQUIRED'
                      else 'NOT_PRODUCED'))
                  # Classify only fixed, non-sensitive Python error vocabulary.
                  # Never emit raw exception text, paths, values, or arbitrary identifiers.
                  summary = r.get('error_summary', '')
                  if not isinstance(summary, str): summary = ''
                  import re
                  allowed = set("""typeerror got an unexpected keyword argument missing required positional arguments
                  takes from to but were given multiple values for cannot unpack non iterable object
                  is not callable subscriptable iterable must be str int float bool list tuple dict
                  nonetype unsupported operand types expected bytes string pathlike tensor device
                  torch cuda mem_get_info get_device_properties model_info hf_hub_download
                  install inventory prepare run_stage run _reference load json dumps
                  revision files_metadata local_dir accept_license execute timeout cwd
                  weights_manifest device host seed reference output prompt dtype
                  forward sample decode encode attention unet comfyui wan
                  none python object function method keyword positional argument
                  integers integer indices slices sequence mapping only
                  isinstance issubclass format open read write tensor size
                  float32 float16 fp16 bfloat16 fp8 safetensors
                  module import name has no attribute can't convert
                  lfs get sha256 required keyword-only keyword argument
                  of and in with a the or at on by as for""".split())
                  words = re.findall(r"[A-Za-z_][A-Za-z_0-9]*", summary.lower())
                  safe = ' '.join(w if w in allowed else '[redacted]' for w in words[:45])
                  print('FREEVIDEO_ERROR_FIXED_VOCABULARY=' + safe)
                  print('FREEVIDEO_ERROR_SUMMARY_PRESENT=' + ('YES' if summary else 'NO'))
              except (OSError,ValueError,UnicodeError):
                  print('FREEVIDEO_WORKER_RECEIPT_INVALID')
          print('FREEVIDEO_NO_NEW_GPU_NO_PUBLIC_MEDIA')
          PY
