name: TWO WORLDS - One real Wan2.2 5B private Kaggle GPU proof

on:
  # Deliberate ONE-TIME push trigger. Code edits or PR reviews never consume GPU.
  push:
    branches: ["gpu/wan5b-first-real-proof-20261111"]
    paths: ["ops/wan_real_gpu.trigger"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-account
  cancel-in-progress: false

jobs:
  one-real-neural-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      RUN_NONCE: wan5b-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Review CPU package and no-network neural tests
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest tests.test_kaggle_neural_video tests.test_comfy_neural tests.test_model_install -v
      - name: Authenticate locally, without printing the Kaggle token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 2; }
          python -m pip install -q "kaggle>=2.2.4" "six>=1.16,<2"
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
      - name: Prepare one private GPU job with publicly safe engineering fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_neural_video prepare \
            --username "$KAGGLE_USERNAME" \
            --nonce "$RUN_NONCE" \
            --destination "$RUNNER_TEMP/tw-wan5b" \
            > "$RUNNER_TEMP/wan_job.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"wan_job.json").read_text())
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("TW_GPU_KERNEL="+r["kernel"]+"\n")
          print("PRIVATE_WAN5B_PROOF_PREPARED",r["model"],r["frames"],r["size"])
          PY
      - name: Submit one official Kaggle T4 video generation
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/tw-wan5b" \
            --timeout 3600 --accelerator NvidiaTeslaT4
      - name: Poll actual private GPU execution (bounded, no blind retries)
        run: |
          python -m studio.kaggle_api poll \
            --kernel "$TW_GPU_KERNEL" --timeout 3500 --interval 90
      - name: One filtered private output fetch (429 stops immediately)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tw-wan-result"
          python -m studio.kaggle_api_limits output \
            --kernel "$TW_GPU_KERNEL" --output-dir "$RUNNER_TEMP/tw-wan-result"
      - name: Verify native 17-frame video, provenance, non-frozen action
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_neural_video verify \
            --path "$RUNNER_TEMP/tw-wan-result" --nonce "$RUN_NONCE"
          echo "::notice::Output is private in user's Kaggle kernel. No media published, no public artifact upload."
      - name: Scrub temporary private outputs from public GitHub runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/tw-wan-result" "$RUNNER_TEMP/tw-wan5b" "$RUNNER_TEMP/wan_job.json"
