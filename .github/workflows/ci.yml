name: Test and preview motion comic

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Render sample preview
        run: python studio/render.py --episode episodes/E01_THE_REFLECTION.json --output dist/E01_preview.mp4 --width 360 --height 640 --fps 10
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-worlds-e01-preview
          path: dist/E01_preview.mp4
          retention-days: 7
