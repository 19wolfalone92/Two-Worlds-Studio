name: FREEVIDEO - rate-limit-safe private output recovery (no GPU)
on:
  push:
    branches:
      - research/freevideo-t4-adaptive-20261123
    paths:
      - '.github/workflows/freevideo-recover-private-output.yml'
      - 'experiments/freevideo_t4/kaggle_private_job.py'
      - 'experiments/freevideo_t4/test_active_kernel_guard.py'
  workflow_dispatch:

permissions:
  contents: read

# Readback only. This workflow never pushes, clones, or launches a Kaggle kernel.
concurrency:
  group: freevideo-private-output-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      ACTIVE_KERNELS: experiments/freevideo_t4/private_transport/active_kernels.json
      ENCRYPTED_PHOTO: experiments/freevideo_t4/private_transport/night-awakens.encrypted.json
      OUTPUT_PUBLIC_KEY: experiments/freevideo_t4/private_transport/freevideo_temporary_output_public_key.txt
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verifier dependencies and run CPU regressions (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN_MISSING'; exit 2; }
          python -m pip install -q 'kaggle==2.2.4' 'six>=1.16,<2' 'cryptography>=43,<48' 'Pillow>=10,<12'
          python -m pip install -e .
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m compileall -q experiments/freevideo_t4
          python -m unittest discover -s experiments/freevideo_t4 -p 'test_*.py' -v
          python - <<'PY'
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from experiments.freevideo_t4.secure_transport import seal_result_zip, unseal_result_zip
          public = base64.b64decode(Path("experiments/freevideo_t4/private_transport/freevideo_temporary_output_public_key.txt").read_text().strip(), validate=True)
          assert len(public) == 32
          test_private = X25519PrivateKey.generate()
          test_public = base64.b64encode(test_private.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode()
          sample = b"FREEVIDEO_RECOVERY_ENCRYPTION_PREFLIGHT" * 100
          envelope = seal_result_zip(sample, test_public)
          private_bytes = test_private.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())
          assert unseal_result_zip(envelope, private_bytes) == sample
          print("FREEVIDEO_TEMP_PUBLIC_KEY_FORMAT_PASS")
          print("FREEVIDEO_RESULT_ENVELOPE_ROUNDTRIP_PASS")
          PY

      - name: Resolve Kaggle account without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
          echo 'FREEVIDEO_PRIVATE_KAGGLE_ACCOUNT_RESOLVED'

      - name: Recover existing kernels with one low-frequency status stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freevideo_recovery"
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import zipfile

          from studio.kaggle_api import parse_status
          from studio.kaggle_api_limits import _classify_cli_error
          from experiments.freevideo_t4.kaggle_private_job import verify_private_result
          from experiments.freevideo_t4.secure_transport import seal_result_zip

          out_dir = Path(os.environ["RUNNER_TEMP"]) / "freevideo_recovery"
          out_dir.mkdir(mode=0o700, exist_ok=True)
          username = os.environ["KAGGLE_USERNAME"]
          public = Path(os.environ["OUTPUT_PUBLIC_KEY"]).read_text(encoding="ascii").strip()
          source = json.loads(Path(os.environ["ENCRYPTED_PHOTO"]).read_text(encoding="utf-8"))
          expected_source_sha = source.get("source_sha256")
          if not isinstance(expected_source_sha, str) or len(expected_source_sha) != 64:
              raise SystemExit("FREEVIDEO_SOURCE_HASH_MANIFEST_INVALID")
          if len(base64.b64decode(public, validate=True)) != 32:
              raise SystemExit("FREEVIDEO_OUTPUT_PUBLIC_KEY_INVALID")

          lock = json.loads(Path(os.environ["ACTIVE_KERNELS"]).read_text(encoding="utf-8"))
          targets = lock.get("submitted_jobs", [])
          if len(targets) != 2:
              raise SystemExit("FREEVIDEO_ACTIVE_KERNEL_LOCK_INVALID")
          for target in targets:
              target["kernel"] = target["kernel"].strip()
              target["state"] = "WAITING"
              target["not_found_count"] = 0
              target["expected_source_revision"] = target["source_revision"]

          # Cool down after the observed HTTP 429. No Kaggle API calls occur here.
          print("FREEVIDEO_KAGGLE_RATE_LIMIT_COOLDOWN_SECONDS=900", flush=True)
          time.sleep(900)

          pending = list(targets)
          calls = 0
          max_calls = 36  # one request every 300 seconds; shared across both kernels
          rate_limited = False
          candidate_successes = []
          stage_successes = []
          errors = []

          while pending and calls < max_calls:
              target = pending.pop(0)
              label = "run-" + str(target["workflow_run_id"])
              kernel = target["kernel"]
              proc = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  check=False, capture_output=True, text=True, timeout=60
              )
              calls += 1
              if proc.returncode != 0:
                  error_code, _safe_detail = _classify_cli_error(proc.stderr or "", proc.stdout or "")
                  print("FREEVIDEO_STATUS_QUERY_CLASS=" + error_code.upper(), flush=True)
                  if error_code == "rate_limited":
                      target["state"] = "RATE_LIMITED"
                      errors.append({"label": label, "state": "RATE_LIMITED"})
                      pending.insert(0, target)
                      rate_limited = True
                      break
                  if error_code == "not_found" and target["not_found_count"] < 2:
                      target["not_found_count"] += 1
                      target["state"] = "NOT_FOUND_RETRY"
                      pending.append(target)
                  else:
                      target["state"] = "STATUS_QUERY_" + error_code.upper()
                      errors.append({"label": label, "state": target["state"]})
                  if pending:
                      time.sleep(300)
                  continue

              try:
                  status = parse_status(proc.stdout)
              except ValueError:
                  target["state"] = "UNKNOWN_STATUS"
                  errors.append({"label": label, "state": target["state"]})
                  continue

              target["state"] = status
              print("FREEVIDEO_EXISTING_KERNEL_STATUS=" + label + ":" + status, flush=True)
              if status in {"QUEUED", "RUNNING", "NEW_SCRIPT"}:
                  pending.append(target)
              elif status in {"COMPLETE", "ERROR", "CANCEL_REQUESTED", "CANCEL_ACKNOWLEDGED"}:
                  folder = out_dir / ("work_" + label)
                  folder.mkdir(mode=0o700, exist_ok=True)
                  readback = subprocess.run(
                      ["kaggle", "kernels", "output", kernel, "-p", str(folder),
                       "--file-pattern",
                       "^(FREEVIDEO_PRIVATE_(PREVIEW|CANDIDATE)[.]zip|freevideo_(result|candidate_result|progress)[.]json)$",
                       "--page-size", "200"],
                      check=False, capture_output=True, text=True, timeout=900
                  )
                  print("FREEVIDEO_READBACK_EXIT=" + label + ":" + str(readback.returncode), flush=True)
                  if readback.returncode != 0:
                      readback_code, _safe_detail = _classify_cli_error(readback.stderr or "", readback.stdout or "")
                      errors.append({"label": label, "state": "READBACK_" + readback_code.upper()})
                      if readback_code == "rate_limited":
                          rate_limited = True
                          break
                  else:
                      for stage in ("candidate", "preview"):
                          archive = folder / ("FREEVIDEO_PRIVATE_" + stage.upper() + ".zip")
                          manifest_path = folder / ("freevideo_candidate_result.json" if stage == "candidate" else "freevideo_result.json")
                          if not archive.is_file() or archive.is_symlink() or not manifest_path.is_file() or manifest_path.is_symlink():
                              continue
                          try:
                              record = json.loads(manifest_path.read_text(encoding="utf-8"))
                              if record.get("source_revision") != target["expected_source_revision"]:
                                  raise ValueError("source_revision_mismatch")
                              if record.get("source_sha256") != expected_source_sha:
                                  raise ValueError("source_sha256_mismatch")
                              verify_private_result(folder, target["nonce"], stage)
                              with zipfile.ZipFile(archive) as package:
                                  if package.testzip() is not None:
                                      raise ValueError("zip_integrity_failure")
                                  job = json.loads(package.read("job.json"))
                              if job.get("source_sha256") != expected_source_sha:
                                  raise ValueError("job_source_sha256_mismatch")
                              envelope = seal_result_zip(archive.read_bytes(), public)
                              destination = out_dir / (label + "_" + stage + "_result.encrypted.json")
                              with destination.open("x", encoding="utf-8") as handle:
                                  json.dump(envelope, handle, separators=(",", ":"))
                              stage_successes.append(label + ":" + stage)
                              if stage == "candidate":
                                  candidate_successes.append(label)
                              print("FREEVIDEO_VERIFIED_DECODED_ENCRYPTED=" + label + ":" + stage.upper(), flush=True)
                          except Exception as exc:
                              errors.append({"label": label, "stage": stage, "error_type": type(exc).__name__})
                              print("FREEVIDEO_STAGE_NOT_ACCEPTED=" + label + ":" + stage.upper() + ":" + type(exc).__name__, flush=True)
              else:
                  target["state"] = "UNSUPPORTED_STATUS"
                  errors.append({"label": label, "state": target["state"]})

              if pending and not rate_limited:
                  time.sleep(300)

          # Always preserve a small encrypted status receipt. It contains no media.
          status_summary = {
              "schema": 1,
              "status": "CANDIDATE_RECOVERED" if candidate_successes else ("RATE_LIMITED" if rate_limited else "NO_VERIFIED_CANDIDATE"),
              "calls_made": calls,
              "candidate_successes": candidate_successes,
              "stage_successes": stage_successes,
              "targets": [{"label": "run-" + str(t["workflow_run_id"]), "kernel_state": t["state"],
                           "source_revision": t["source_revision"], "nonce": t["nonce"]} for t in targets],
              "errors": errors,
              "visual_quality": "NOT_YET_VISUALLY_REVIEWED",
              "published": False
          }
          diag_zip = out_dir / "freevideo_recovery_status.zip"
          with zipfile.ZipFile(diag_zip, "w", compression=zipfile.ZIP_DEFLATED) as package:
              package.writestr("recovery_status.json", json.dumps(status_summary, sort_keys=True))
              package.writestr("minimum_size_padding.bin", os.urandom(2048))
          envelope = seal_result_zip(diag_zip.read_bytes(), public)
          with (out_dir / "freevideo_recovery_status.encrypted.json").open("x", encoding="utf-8") as handle:
              json.dump(envelope, handle, separators=(",", ":"))

          if not candidate_successes:
              print("FREEVIDEO_NO_VERIFIED_CANDIDATE_YET", flush=True)
              raise SystemExit(2)
          print("FREEVIDEO_CANDIDATE_RECOVERY_COMPLETE; VISUAL_REVIEW_REQUIRED", flush=True)
          PY

      - name: Upload only encrypted private results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: freevideo-encrypted-private-recovery
          path: ${{ runner.temp }}/freevideo_recovery/*.encrypted.json
          retention-days: 3
          if-no-files-found: ignore
