name: TWO WORLDS - Manual Kaggle API GPU

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Generate a portrait, a sample voice, or both (uses free quotas)"
        type: choice
        required: true
        default: portrait
        options:
          - portrait
          - voice
          - both
      body:
        description: "Physical body (ignored for voice-only)"
        type: choice
        default: earth_mira
        options:
          - earth_mira
          - noctaris_lyra
          - earth_eli
          - noctaris_ilan
      view:
        description: "Character turnaround angle"
        type: choice
        default: front
        options:
          - front
          - three_quarter
          - profile
          - full_body
          - expression

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-api
  cancel-in-progress: false

jobs:
  launch-private-kaggle-job:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      JOB_MODE: ${{ inputs.mode }}
      JOB_BODY: ${{ inputs.body }}
      JOB_VIEW: ${{ inputs.view }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Kaggle credentials exist (never print the token)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::Missing repository secret KAGGLE_API_TOKEN. Configure it in Settings > Secrets and variables > Actions."
            exit 2
          fi
          echo "Token configured; optional account username will be identified from authenticated CLI."

      - name: Install official Kaggle CLI
        run: python -m pip install "kaggle>=2.2.4"

      - name: Authenticate and detect Kaggle username without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          kaggle quota >/dev/null
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"

      - name: Prepare private Kaggle kernel from pinned GitHub revision
        shell: bash
        run: |
          python -m studio.kaggle_api prepare \
            --username "$KAGGLE_USERNAME" \
            --run-nonce "$RUN_NONCE" \
            --mode "$JOB_MODE" \
            --body "$JOB_BODY" \
            --view "$JOB_VIEW" \
            --output-dir dist/kaggle_submission

      - name: Upload and launch private Kaggle notebook through official API
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_MODE" == "voice" ]]; then
            kaggle kernels push -p dist/kaggle_submission --timeout 3600
          else
            kaggle kernels push -p dist/kaggle_submission --timeout 3600 --accelerator NvidiaTeslaT4
          fi

      - name: Monitor GPU job to completion (never assume success)
        shell: bash
        run: |
          python -m studio.kaggle_api poll \
            --kernel "$KAGGLE_USERNAME/two-worlds-visual-gpu" \
            --timeout 3300 \
            --interval 45

      - name: Download private Kaggle results into temporary runner
        shell: bash
        run: |
          mkdir -p dist/kaggle_result
          kaggle kernels output "$KAGGLE_USERNAME/two-worlds-visual-gpu" \
            -p dist/kaggle_result --force

      - name: Check run identity and nonempty generated PNG/WAV
        shell: bash
        run: |
          python -m studio.kaggle_api verify \
            --output-dir dist/kaggle_result --run-nonce "$RUN_NONCE"

      - name: Return image or audio ZIP ONLY when GitHub repository is private
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: two-worlds-kaggle-private-${{ github.run_number }}
          path: |
            dist/kaggle_result/TWO_WORLDS_ARTIFACTS.zip
            dist/kaggle_result/two_worlds_job_receipt.json
          retention-days: 3
          if-no-files-found: error

      - name: Public-repository privacy warning
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::warning::Repository is public: NOT uploading unreleased AI art/voices to public Actions artifacts. Download results from the private Kaggle kernel."
