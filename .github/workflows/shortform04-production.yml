name: TWO WORLDS - Private Shortform04 bounded production
on:
  push:
    branches: ['production/story-glitch-batch04-20261105']
    paths: ['.github/shortform04_requests/production.json']
env:
  TW_REQUEST_DIR: .github/shortform04_requests
  TW_RELAY_BRANCH: production/story-glitch-batch04-20261105
permissions:
  contents: read
concurrency:
  group: tw-shortform04-${{ contains(github.event.head_commit.message, '[voice]') && 'voice' || contains(github.event.head_commit.message, '[image]') && 'image' || 'source' }}
  cancel-in-progress: false
jobs:
  production:
    if: >-
      github.repository == '19wolfalone92/Two-Worlds-Studio' &&
      github.ref == 'refs/heads/production/story-glitch-batch04-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: requested
        name: Only the exact request-changing commit can consume GPU quota
        run: |
          if git diff --name-only HEAD^ HEAD -- .github/shortform04_requests/production.json | grep -q production.json; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.requested.outputs.execute == 'true'
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI and transport tools
        if: steps.requested.outputs.execute == 'true'
        run: python -m pip install 'kaggle==2.2.5' six cryptography Pillow numpy
      - name: Prepare public input handshake
        if: steps.requested.outputs.execute == 'true'
        run: python -m tools.batch03_production_relay prepare
      - name: Publish input public key only
        if: steps.requested.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shortform04-input-public-key
          path: dist/handshake/
          retention-days: 1
      - name: Produce bounded private scene batch with existing account authorization
        if: steps.requested.outputs.execute == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: wolf19loner92
          GH_READ_TOKEN: ${{ github.token }}
        run: python -m tools.batch03_production_relay produce
      - name: Return encrypted media and recovery receipt only
        if: ${{ always() && steps.requested.outputs.execute == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shortform04-private-production-result
          path: dist/private_batch03/
          retention-days: 3
          if-no-files-found: error
