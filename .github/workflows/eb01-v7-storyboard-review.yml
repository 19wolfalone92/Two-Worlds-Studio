name: EB01 V7 - seven consistent shot contact sheet (CPU, NO GPU)

on:
  push:
    branches: ["production/elizabeth-bones-full-native-v7-20261112"]
    paths: ["ops/eb01_v7_storyboard.trigger"]

permissions:
  contents: read

jobs:
  private_cpu_storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: wolf19loner92
      PRIVATE_SOURCE: wolf19loner92/eb01-v7-private-production-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Prove all seven source-derived frames before any video GPU
        run: |
          python -m pip install -q 'kaggle>=2.2.4' 'six>=1.16,<2' 'Pillow>=10,<12'
          python -m unittest tests.test_eb01_v7_storyboard -v
          python -m py_compile studio/eb01_v7_storyboard.py
      - name: Prepare private CPU kernel; full source art never goes into GitHub
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          src=Path("studio/eb01_v7_storyboard.py").read_text()
          name="eb01-v7-review-"+hashlib.sha256(os.environ["GITHUB_RUN_ID"].encode()).hexdigest()[:12]
          dest=Path(os.environ["RUNNER_TEMP"])/"v7-storyboard-worker"
          dest.mkdir()
          tail="""
from pathlib import Path
import json,traceback
try:
    root=Path("/kaggle/temp/v7-review-private")
    lock=gather_private(Path("/kaggle/input"),root)
    sheet=Path("/kaggle/working/EB01_V7_ALL_SEVEN_REFERENCES_REVIEW_ONLY.jpg")
    contact_sheet(root,sheet)
    result={
      "schema":7,"status":"PRIVATE_SEVEN_SHOT_REFERENCE_REVIEW_PENDING",
      "canon_sources":lock["source_sha256"],
      "frames":{k:v["reference_sha256"] for k,v in lock["scenes"].items()},
      "voices":lock["voice_sha256"],"human_approved":False,
      "video_generated":False,"gpu_executed":False,"published":False}
    Path("/kaggle/working/EB01_V7_FRAMES_RECEIPT.json").write_text(json.dumps(result,indent=2))
    print("SEVEN_REAL_CANON_REFERENCE_CROPS_CREATED_CPU_ONLY")
except BaseException as e:
    Path("/kaggle/working/EB01_V7_FRAMES_RECEIPT.json").write_text(
      json.dumps({"status":"FAILED","reason":str(e)[:200],
                  "gpu_executed":False,"published":False}))
    traceback.print_exc()
    raise
"""
          (dest/"kernel_main.py").write_text(src+"\n"+tail)
          metadata={
            "id":os.environ["KAGGLE_USERNAME"]+"/"+name,
            "title":name,"code_file":"kernel_main.py",
            "language":"python","kernel_type":"script","is_private":"true",
            "enable_gpu":"false","enable_internet":"false",
            "dataset_sources":[os.environ["PRIVATE_SOURCE"]],
            "competition_sources":[],"kernel_sources":[],"model_sources":[]}
          (dest/"kernel-metadata.json").write_text(json.dumps(metadata,indent=2))
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write("V7_STORYBOARD_KERNEL="+metadata["id"]+"\n")
          print("V7_CPU_CONTACT_KERNEL",metadata["id"])
          PY
          kaggle kernels push -p "$RUNNER_TEMP/v7-storyboard-worker" --timeout 900
      - name: Poll only this zero-GPU job
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_api poll --kernel "$V7_STORYBOARD_KERNEL" --timeout 650 --interval 35
      - name: Read back ONLY small source-derived visual review and hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eb01-v7-contact-only"
          kaggle kernels output "$V7_STORYBOARD_KERNEL" -p "$RUNNER_TEMP/eb01-v7-contact-only" --force
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"eb01-v7-contact-only"
          r=json.loads((p/"EB01_V7_FRAMES_RECEIPT.json").read_text())
          assert r["status"]=="PRIVATE_SEVEN_SHOT_REFERENCE_REVIEW_PENDING",r
          assert len(r["frames"])==7 and len(r["voices"])==6
          assert (p/"EB01_V7_ALL_SEVEN_REFERENCES_REVIEW_ONLY.jpg").is_file()
          assert not r["human_approved"] and not r["video_generated"]
          print("EB01_SEVEN_CANON_CROPS_READY_FOR_HUMAN_CREATIVE_REVIEW")
          PY
      - name: Upload LOW RES review image and metadata, NEVER original PNG or WAV
        uses: actions/upload-artifact@v4
        with:
          name: EB01_V7_SEVEN_REAL_CANON_SHOTS_UNAPPROVED
          path: ${{ runner.temp }}/eb01-v7-contact-only/*
          retention-days: 7
          if-no-files-found: error
      - name: Inspect CPU failure without rerunning GPUs
        if: failure()
        shell: bash
        run: |
          if [[ -n "${V7_STORYBOARD_KERNEL:-}" ]]; then
            kaggle kernels status "$V7_STORYBOARD_KERNEL" || true
            mkdir -p "$RUNNER_TEMP/eb01-v7-contact-only"
            kaggle kernels output "$V7_STORYBOARD_KERNEL" -p "$RUNNER_TEMP/eb01-v7-contact-only" --force || true
            cat "$RUNNER_TEMP/eb01-v7-contact-only/EB01_V7_FRAMES_RECEIPT.json" || true
          fi
      - name: Wipe runner review workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/v7-storyboard-worker" "$RUNNER_TEMP/eb01-v7-contact-only"
