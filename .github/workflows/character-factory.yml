name: TWO WORLDS - Requested private character factory

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/factory_requests/request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-api
  cancel-in-progress: false

jobs:
  generate-requested-private-characters:
    # One explicit user-requested branch. Ordinary CI/forks never consume GPU.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/from-scratch-character-factory')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official worker tools and private-output transport
        run: python -m pip install 'kaggle>=2.2.4' -r requirements.txt -r requirements-private-output.txt
      - name: Validate explicit bounded generation request and public recipient key
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from studio.character_factory import _validate_spec
          request=json.loads(Path('.github/factory_requests/request.json').read_text())
          if request.get('enabled') is not True or request.get('max_images') != 6:
              raise ValueError('This request is limited to six character drawings')
          _validate_spec(request['design_spec'])
          if 'PRIVATE KEY' in Path('.github/factory_requests/recipient_public.pem').read_text():
              raise ValueError('Never submit a private decryption key to the runner')
          Path('dist').mkdir(exist_ok=True)
          Path('dist/design_spec.json').write_text(json.dumps(request['design_spec']))
          PY
      - name: Verify existing Kaggle connection without printing credentials
        run: |
          test -n "$KAGGLE_API_TOKEN"
          kaggle quota >/dev/null
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
      - name: Prepare text-only character factory on the pinned source revision
        run: |
          python -m studio.kaggle_api prepare --username "$KAGGLE_USERNAME" \
            --run-nonce "$RUN_NONCE" --source-sha "$SOURCE_REVISION" \
            --mode design --design-spec dist/design_spec.json --max-images 6 \
            --output-dir dist/kaggle_submission
          python - <<'PY'
          import os,json
          from pathlib import Path
          handle=json.loads(Path('dist/kaggle_submission/kernel-metadata.json').read_text())['id']
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('KERNEL_HANDLE='+handle+'\n')
          PY
      - name: Launch the private Studio GPU worker
        run: kaggle kernels push -p dist/kaggle_submission --timeout 3600 --accelerator NvidiaTeslaT4
      - name: Wait for actual generated drawings
        run: |
          python -m studio.kaggle_api poll --kernel "$KERNEL_HANDLE" \
            --timeout 3300 --interval 45
      - name: Download and decode this run's private output
        if: ${{ always() && env.KERNEL_HANDLE != '' }}
        run: |
          kaggle kernels output "$KERNEL_HANDLE" -p dist/kaggle_result --force
          python -m studio.kaggle_api verify --output-dir dist/kaggle_result --run-nonce "$RUN_NONCE"
      - name: Encrypt drawings for the request's private recipient
        if: ${{ always() && hashFiles('dist/kaggle_result/**/two_worlds_job_receipt.json') != '' }}
        run: |
          python - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          from studio.sealed_artifacts import seal
          result=Path('dist/kaggle_result')
          with zipfile.ZipFile('dist/private_result.zip','x',zipfile.ZIP_DEFLATED) as z:
              for name in ['TWO_WORLDS_ARTIFACTS.zip','two_worlds_job_receipt.json']:
                  found=list(result.rglob(name))
                  if name=='TWO_WORLDS_ARTIFACTS.zip' and not found:continue
                  if len(found)!=1:raise ValueError('Missing/duplicate private result file')
                  z.write(found[0],name)
              for log in result.rglob('*.log'):
                  z.write(log,'worker_logs/'+log.name)
          context={'run_nonce':os.environ['RUN_NONCE'],'source_sha':os.environ['SOURCE_REVISION']}
          info=seal(Path('dist/private_result.zip'),Path('.github/factory_requests/recipient_public.pem'),
                    Path('dist/private_return/TW_FACTORY_RESULT.twenc'),context)
          print(json.dumps(info))
          PY
      - name: Return encrypted bytes only; raw artwork remains private
        if: ${{ always() && hashFiles('dist/private_return/TW_FACTORY_RESULT.twenc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: two-worlds-sealed-character-factory-${{ github.run_number }}
          path: dist/private_return/TW_FACTORY_RESULT.twenc
          retention-days: 3
          if-no-files-found: error
