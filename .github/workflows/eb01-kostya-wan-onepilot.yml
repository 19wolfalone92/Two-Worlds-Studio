name: TWO WORLDS V6 - single REAL skeleton Wan2.2 I2V pilot (review only)

# Deliberate ONE-TIME trigger after inspection of contact preview.
# This job must not run from routine source edits or PR activity.
on:
  push:
    branches: ["production/eb01-canon-first-v6-20261112"]
    paths: ["ops/eb01_motion.trigger"]

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-account
  cancel-in-progress: false

jobs:
  one-real-private-wan5b-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SOURCE_CANON_KERNEL: wolf19loner92/eb01-v6-canon-adad762a9834
      RUN_NONCE: eb01wan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline privacy, provenance and one-shot real GPU worker tests
        run: |
          python -m pip install -q -r requirements.txt 'kaggle>=2.2.4' 'six>=1.16,<2'
          python -m unittest tests.test_eb01_canon_kaggle tests.test_eb01_kostya_wan_preview tests.test_kaggle_neural_video -v
      - name: Authenticate with existing user Kaggle secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
      - name: Read back original PRIVATE canonical art ONLY to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eb01-parent-private"
          python -m studio.kaggle_api_limits output \
            --kernel "$SOURCE_CANON_KERNEL" \
            --output-dir "$RUNNER_TEMP/eb01-parent-private"
      - name: Verify original canonical source and prepare ONE private Wan I2V
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          from studio.eb01_canon_kaggle import verify
          from studio.eb01_kostya_wan_preview import parent_reference
          root=Path(os.environ["RUNNER_TEMP"])/"eb01-parent-private"
          v=verify(root,"eb01canon-43158183875-1")
          _,parent_sha=parent_reference(root)
          assert v["status"]=="TWO_PRIVATE_REAL_CANDIDATES_REQUIRE_HUMAN_REVIEW"
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("TW_PRIVATE_CANON_SHA="+parent_sha+"\n")
          print("PRIVATE_ORIGINAL_CANON_SHA_VERIFIED_NO_UPLOAD",parent_sha)
          PY
          python -m studio.eb01_kostya_wan_preview prepare \
            --username "$KAGGLE_USERNAME" --nonce "$RUN_NONCE" \
            --source-output "$RUNNER_TEMP/eb01-parent-private" \
            --destination "$RUNNER_TEMP/eb01-wan-private" \
            > "$RUNNER_TEMP/eb01-wan-plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"eb01-wan-plan.json").read_text())
          assert d["frame_count"]==49 and not d["gpu_executed"]
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("TW_WAN_PILOT_KERNEL="+d["kernel"]+"\n")
          print("ONE_REAL_49_FRAME_NATIVE_WAN_PILOT_PRIVATE",d["kernel"])
          PY
      - name: Submit exactly ONE original Wan2.2 T4 GPU video job
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/eb01-wan-private" \
            --timeout 3600 --accelerator NvidiaTeslaT4
          echo "::notice::Wan model GPU inference launched once. No duplicate/retry, no full episode."
      - name: Poll only existing submitted private Wan GPU notebook
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.kaggle_api poll \
            --kernel "$TW_WAN_PILOT_KERNEL" --timeout 3500 --interval 90
      - name: Download only existing private Wan MP4 result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eb01-wan-result"
          python -m studio.kaggle_api_limits output \
            --kernel "$TW_WAN_PILOT_KERNEL" \
            --output-dir "$RUNNER_TEMP/eb01-wan-result"
      - name: Validate real video decode motion provenance SHA and source
        shell: bash
        run: |
          set -euo pipefail
          python -m studio.eb01_kostya_wan_preview verify \
            --path "$RUNNER_TEMP/eb01-wan-result" \
            --nonce "$RUN_NONCE" \
            --parent-original-sha "$TW_PRIVATE_CANON_SHA"
          mkdir -p "$RUNNER_TEMP/eb01-wan-review"
          python - <<'PY'
          import zipfile,os,json,hashlib
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])
          zips=list((folder/"eb01-wan-result").rglob("TWO_WORLDS_ARTIFACTS.zip"))
          assert len(zips)==1
          out=folder/"eb01-wan-review"
          with zipfile.ZipFile(zips[0]) as z:
              video=z.read("neural_proof.mp4")
              proof=json.loads(z.read("neural_proof.receipt.json"))
              qc=json.loads(z.read("technical_qc.json"))
          sha=hashlib.sha256(video).hexdigest()
          assert sha==proof["clip_sha256"] and qc["all_frames_decoded"]
          (out/"EB01_KOSTYA_REAL_WAN_I2V_PREVIEW.mp4").write_bytes(video)
          report={
              "status":"REAL_49_FRAME_NEURAL_VIDEO_UNAPPROVED",
              "engine":"Wan2.2 TI2V 5B + native ComfyUI",
              "invideo_used":False,"synthetic_fixture":False,
              "parent_original_image_sha256":os.environ["TW_PRIVATE_CANON_SHA"],
              "pilot_source_image_sha256":proof["reference_sha256"],
              "generated_video_sha256":sha,
              "frame_count":49,"native_fps":24,
              "real_motion_detected":True,
              "human_artistic_approval":False,
              "full_episode_ready":False,"published":False}
          (out/"EB01_WAN_PILOT_QA.json").write_text(json.dumps(report,indent=2))
          print("WAN_REAL_PILOT_REVIEW_READY",sha,len(video))
          PY
      - name: Deliver ONLY MP4 review; never source skeleton original
        uses: actions/upload-artifact@v4
        with:
          name: EB01_KOSTYA_REAL_WAN22_I2V_49_FRAME_REVIEW_ONLY
          path: ${{ runner.temp }}/eb01-wan-review/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: On failure, inspect original private job status WITHOUT retry
        if: failure()
        shell: bash
        run: |
          if [[ -n "${TW_WAN_PILOT_KERNEL:-}" ]]; then
            kaggle kernels status "$TW_WAN_PILOT_KERNEL" || true
          fi
          echo "::notice::GPU job is never automatically resubmitted."
      - name: Securely remove all original private media and kernel source
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/eb01-parent-private" "$RUNNER_TEMP/eb01-wan-private" \
            "$RUNNER_TEMP/eb01-wan-result" "$RUNNER_TEMP/eb01-wan-review" \
            "$RUNNER_TEMP/eb01-wan-plan.json"
