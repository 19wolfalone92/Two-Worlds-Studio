name: TWO WORLDS - Elizabeth native Studio quick offline contract

on:
  push:
    branches: ["production/elizabeth-bones-native-studio-pilot-20261111"]
    paths:
      - "studio/elizabeth_episode_pilot.py"
      - "tools/kaggle_elizabeth_pilot_entry.py"
      - "tests/test_elizabeth_episode_pilot.py"
      - ".github/workflows/elizabeth-fast-contract.yml"
  pull_request:
    paths:
      - "studio/elizabeth_episode_pilot.py"
      - "tools/kaggle_elizabeth_pilot_entry.py"
      - "tests/test_elizabeth_episode_pilot.py"
      - ".github/workflows/elizabeth-fast-contract.yml"

permissions:
  contents: read

jobs:
  studio-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify CPU dependencies and native seven-scene contract only
        run: |
          python -m pip install -q -r requirements.txt
          command -v ffmpeg
          command -v ffprobe
          python -m unittest tests.test_elizabeth_episode_pilot -v
      - name: Compile Kaggle worker and Studio orchestrator without running GPU
        run: |
          python -m py_compile studio/elizabeth_episode_pilot.py tools/kaggle_elizabeth_pilot_entry.py
