name: EB01 - CPU visual gate regression (no GPU)

on:
  push:
    branches: ["production/elizabeth-bones-native-studio-pilot-20261111"]
    paths: ["tools/eb01_visual_gate.py", "tests/test_eb01_visual_gate.py", ".github/workflows/eb01-visual-gate-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q 'Pillow>=10,<12'
      - run: python -m unittest tests.test_eb01_visual_gate -v
