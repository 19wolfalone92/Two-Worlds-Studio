name: EB01 — two-account shared-source download and SHA acceptance
on:
  push:
    branches: [feature/eb01-kaggle-private-source-two-account-sync-20261116]
    paths:
      - tools/eb01_dual_source_acceptance.py
      - tests/test_eb01_dual_source_acceptance.py
      - .github/workflows/eb01-dual-shared-source-acceptance.yml
      - ops/eb01_shared_source_recheck.trigger
permissions:
  contents: read
concurrency:
  group: eb01-shared-source-byte-acceptance
  cancel-in-progress: false
jobs:
  source_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify credential isolation and fail-closed SHA gates
        run: |
          python -m pip -q install 'Pillow>=10,<12' 'kaggle>=2.2.4' 'six>=1.16,<2'
          python -m unittest tests.test_eb01_dual_source_acceptance -v
      - name: Recheck sharing by independently downloading and hashing all eight originals
        env:
          EB01_OWNER_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          EB01_SECOND_TOKEN: ${{ secrets.KAGGLE_API_TOKEN2 }}
        run: python -m tools.eb01_dual_source_acceptance
      - name: Preserve only sanitized acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EB01_DUAL_SOURCE_ACCEPTANCE_NO_MEDIA
          path: ${{ runner.temp }}/EB01_DUAL_SOURCE_ACCEPTANCE_SAFE.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove ephemeral private bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP"/eb01-source-acceptance-*
