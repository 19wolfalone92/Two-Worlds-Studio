name: FREEVIDEO - isolated Kaggle API connectivity (NO GPU)
on:
  push:
    branches:
      - research/freevideo-t4-adaptive-20261123
    paths:
      - '.github/workflows/freevideo-kaggle-api-preflight.yml'
permissions:
  contents: read

concurrency:
  group: freevideo-kaggle-api-preflight
  cancel-in-progress: false

jobs:
  verify-private-kaggle-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing Kaggle API secret; do not print it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo 'FREEVIDEO_KAGGLE_BLOCKED_MISSING_SECRET (GPU not started)'
            exit 2
          fi
          echo 'FREEVIDEO_KAGGLE_SECRET_PRESENT (no GPU used)'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI without neural models
        run: python -m pip install -q 'kaggle>=2.2.4'
      - name: Verify authenticated Kaggle private notebook access (primary token)
        id: primary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # One read-only API request. No credentials or notebook titles logged.
          python -m experiments.freevideo_t4.kaggle_auth_adapter
          echo 'FREEVIDEO_PRIVATE_REFERENCE_NOT_UPLOADED'
      - name: Check secondary readback token only if primary API failed
        if: ${{ steps.primary.outcome == 'failure' }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo 'FREEVIDEO_SECONDARY_KAGGLE_TOKEN_NOT_CONFIGURED'
            exit 2
          fi
          python -m experiments.freevideo_t4.kaggle_auth_adapter
          echo 'FREEVIDEO_SECONDARY_AUTHENTICATED_READ_ONLY_NO_GPU'
