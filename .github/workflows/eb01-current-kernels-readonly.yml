name: EB01 V7 - read only status of active genuine private GPU retakes
on:
  push:
    branches: ["fix/eb01-s02-private-raw-preservation-20261113"]
    paths: ["ops/eb01_current_private_gpu_check.trigger"]
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: wolf19loner92
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read only exact native Wan S05 S06 S02 kernel states
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip -q install 'kaggle>=2.2.4'
          for kernel in \
            wolf19loner92/eb01-v7-s05-only-75dbb6f053bf \
            wolf19loner92/eb01-v7-s05-only-c36aa6d1d281 \
            wolf19loner92/eb01-v7-s06-only-e7b9c9a3725d \
            wolf19loner92/eb01-v7-s02-only-bcc9f17c3faf; do
            printf '\nSOURCE_KERNEL: %s\n' "$kernel"
            kaggle kernels status "$kernel" || true
          done
          echo "No model launched, no private raw downloaded, no social posting."
