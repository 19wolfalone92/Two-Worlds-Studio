name: EB01 V7 - read only status of active genuine private GPU retakes
on:
  push:
    branches: ["fix/eb01-s02-private-raw-preservation-20261113"]
    paths: ["ops/eb01_current_private_gpu_check.trigger"]
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: wolf19loner92
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read only current source-pinned 33 frame true LTX I2V GPU pilot status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip -q install 'kaggle>=2.2.4' 'six>=1.16,<2'
          python -c 'import kaggle, six; print("KAGGLE_CLIENT_DEPENDENCIES_VERIFIED")'
          for kernel in \
            wolf19loner92/eb01-ltx2b-pilot33-60202f594b77; do
            printf '\nSOURCE_KERNEL: %s\n' "$kernel"
            kaggle kernels status "$kernel" 2>&1 || echo "KERNELOBJECT_NOT_FOUND_OR_UNREADABLE"
            kaggle kernels files "$kernel" 2>&1 | tail -30 || true
            kaggle kernels logs "$kernel" 2>&1 | tail -100 || true
          done
          echo "No model launched, no private raw downloaded, no social posting."
