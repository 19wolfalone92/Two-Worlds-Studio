name: EB01 - archive ONE original verified MP4 to OWNER PRIVATE Kaggle dataset ONLY
on:
  push:
    branches: ["fix/eb01-s02-private-raw-preservation-20261113"]
    paths: [ops/eb01_private_archive_now.trigger]
permissions:
  contents: read
concurrency:
  group: eb01-original-private-kaggle-archive
  cancel-in-progress: false
jobs:
  archive_one_sha_pinned_neural_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify no public publishing, no paid services, exact owner and file SHA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile tools/eb01_archive_verified_private_pilot.py
          python -m unittest tests.test_eb01_archive_verified_private_pilot -v
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("ops/eb01_private_archive_now.trigger")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert set(d)=={"schema","kernel","clip_sha256","owner_private_dataset_only","public_upload_forbidden","no_paid_services"}
          assert d["schema"]==1
          assert re.fullmatch(r"wolf19loner92/eb01-ltx2b-pilot33-[0-9a-f]{12}",d["kernel"])
          assert re.fullmatch(r"[a-f0-9]{64}",d["clip_sha256"])
          assert d["owner_private_dataset_only"] is True
          assert d["public_upload_forbidden"] is True
          assert d["no_paid_services"] is True
          print("EB01_EXACT_OWNER_PRIVATE_DATASET_ALLOWED_SHA_LOCKED_NO_PUBLIC_FILE")
          PY
      - name: Install real FFmpeg and authenticated owner Kaggle client; NO GPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip -q install 'kaggle>=2.2.4' 'numpy>=1.26,<3'
      - name: Read existing original GPU result and submit ONLY to new owner-private Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          d=json.loads(Path("ops/eb01_private_archive_now.trigger").read_text())
          subprocess.run([sys.executable,"-m","tools.eb01_archive_verified_private_pilot",
              "--kernel",d["kernel"],"--sha256",d["clip_sha256"]],
              check=True,timeout=750)
          PY
      - name: Publish ONLY privacy-safe hash/ACL report, NO movie/images/audio/prompts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EB01_OWNER_PRIVATE_KAGGLE_ARCHIVAL_RECEIPT_ONLY
          path: ${{ runner.temp }}/EB01_PRIVATE_ARCHIVE_STATUS_ONLY.json
          retention-days: 7
          if-no-files-found: warn
      - name: Wipe temporary media staging on runner (never upload it)
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name 'eb01-private-*' -exec rm -rf -- {} +
