name: T-FLEX — Kaggle private Hunyuan session failure reason (READ ONLY)
on:
  push:
    branches: ["research/tflex-v9-dual-kaggle-preflight-20261120"]
    paths:
      - ops/tflex_v94_safe_failure_message.py
      - .github/workflows/tflex-v94-safe-failure-message.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-kaggle-status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip -q install "kaggle==2.2.5" "kagglehub>=1.0.2" "six>=1.16,<2"
      - run: python ops/tflex_v94_safe_failure_message.py
      - run: echo "Never printed Kaggle identities, logs or user original game screenshots."
