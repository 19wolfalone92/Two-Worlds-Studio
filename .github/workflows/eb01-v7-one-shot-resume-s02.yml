name: EB01 V7 - resume ONE missing native Wan scene, save private MP4

on:
  push:
    branches: ["fix/eb01-v7-resume-existing-clips-20261112"]
    paths: ["ops/eb01_v7_resume_S02.trigger"]

permissions:
  contents: read

concurrency:
  group: two-worlds-kaggle-account
  cancel-in-progress: false

jobs:
  one_true_wan_scene_only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: wolf19loner92
      RUN_NONCE: eb01v7-s02-${{ github.run_id }}-${{ github.run_attempt }}
      SHOT: S02
      PRIVATE_INPUT_DATASET: wolf19loner92/eb01-v7-private-production-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict CPU tests and independent original SHA contract BEFORE GPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'kaggle>=2.2.4' 'six>=1.16,<2' 'Pillow>=10,<12' 'numpy>=1.26,<3'
          python -m unittest tests.test_eb01_v7_isolated_resume tests.test_eb01_v7_real_sha_contract tests.test_eb01_v7_storyboard -v
          python -m py_compile tools/kaggle_eb01_v7_single_shot.py
          python - <<'PY'
          from tools.kaggle_eb01_v7_single_shot import ALLOWED
          from studio.eb01_v7_storyboard import SHOTS
          from studio.comfy_neural import wan22_workflow
          sid="S02"
          row=next(s for s in SHOTS if s[0]==sid)
          assert sid in ALLOWED and "S00" not in ALLOWED and "S01" not in ALLOWED
          wf=wan22_workflow("S02.png",row[-1],202611120+2*31,
              width=320,height=576,frames=row[2]+4,steps=20)
          assert wf["55"]["inputs"]["length"]==row[2]+4
          print("PRE_GPU_ISOLATED_REAL_S02_SHA_AND_WORKFLOW_PASS")
          PY
      - name: Prepare one small private Kaggle worker - no original PNG/WAV
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import os,json,base64,hashlib
          from pathlib import Path
          from tools.kaggle_eb01_v7_single_shot import check_configuration
          data={
             "schema":7,"nonce":os.environ["RUN_NONCE"],"shot":os.environ["SHOT"],
             "model":"wan22-5b","private":True,"new_gpu_jobs":1,
             "source_dataset":os.environ["PRIVATE_INPUT_DATASET"],
             "revision":os.environ["GITHUB_SHA"],
             "branch":"fix/eb01-v7-resume-existing-clips-20261112",
             "allow_social_publish":False,"allow_regenerate_good_shots":False
          }
          assert check_configuration(data)=="S02"
          code=Path("tools/kaggle_eb01_v7_single_shot.py").read_text()
          assert code.count("__EB01_V7_RESUME_SHOT_CONFIG_B64__")==1
          render=code.replace("__EB01_V7_RESUME_SHOT_CONFIG_B64__",
             base64.b64encode(json.dumps(data,sort_keys=True).encode()).decode())
          assert len(render.encode())<70_000
          assert "iVBORw0KGgo" not in render and "KAGGLE_API_TOKEN=" not in render
          slug="eb01-v7-s02-only-"+hashlib.sha256(data["nonce"].encode()).hexdigest()[:12]
          metadata={
            "id":os.environ["KAGGLE_USERNAME"]+"/"+slug,"title":slug,
            "code_file":"kernel_main.py","language":"python","kernel_type":"script",
            "is_private":"true","enable_gpu":"true","enable_internet":"true",
            "machine_shape":"NvidiaTeslaT4",
            "dataset_sources":[data["source_dataset"]],"competition_sources":[],
            "kernel_sources":[],"model_sources":[]
          }
          folder=Path(os.environ["RUNNER_TEMP"])/"eb01-v7-single-shot-worker"
          folder.mkdir()
          (folder/"kernel_main.py").write_text(render)
          (folder/"kernel-metadata.json").write_text(json.dumps(metadata,indent=2))
          with open(os.environ["GITHUB_ENV"],"a") as file:
              file.write("EB01_NEW_PRIVATE_SHOT_KERNEL="+metadata["id"]+"\n")
          print("ONE_MISSING_GPU_SCENE_PREPARED",metadata["id"],"no_original_media_uploaded",flush=True)
          PY
      - name: Submit exactly one 3600-second Kaggle real S02 GPU job, never S00/S01
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/eb01-v7-single-shot-worker" \
            --timeout 3600 --accelerator NvidiaTeslaT4
          kaggle kernels status "$EB01_NEW_PRIVATE_SHOT_KERNEL"
          echo "::notice::One missing scene S02 submitted to PRIVATE Kaggle; S00/S01 preserved. GitHub CI success is NOT a completed MP4."
      - name: Clean transient worker source
        if: always()
        run: rm -rf "$RUNNER_TEMP/eb01-v7-single-shot-worker"
