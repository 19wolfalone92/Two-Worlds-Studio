name: T-FLEX V9 — real independent Kaggle T4 hardware check (private)
on:
  push:
    branches: ["research/tflex-v9-dual-kaggle-preflight-20261120"]
    paths:
      - .github/workflows/tflex-v9-kaggle-private-gpu-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-private-gpu-job-per-legitimate-account:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        account: [2]
    concurrency:
      group: tflex-v9-gpu-one-job-legitimate-account-${{ matrix.account }}
      cancel-in-progress: false
    env:
      KAGGLE_API_TOKEN: ${{ matrix.account == 1 && secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_API_TOKEN2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle tools and missing Python six dependency
        run: python -m pip -q install "kaggle==2.2.5" "kagglehub>=1.0.2" "six>=1.16,<2"
      - name: Submit isolated PRIVATE T4 proof; no screenshots or artwork
        run: python ops/tflex_v9_kaggle_gpu_probe.py launch
      - name: Wait for true private Kaggle GPU completion
        run: python ops/tflex_v9_kaggle_gpu_probe.py poll
      - name: Validate retrieved CUDA devices from actual private Kaggle output
        run: python ops/tflex_v9_kaggle_gpu_probe.py verify
      - name: Privacy statement
        if: always()
        run: |
          echo "Only a code-only private GPU probe was submitted."
          echo "No private screenshots, originals, or artwork uploaded."
          echo "No 3D master claimed as generated by this hardware check."
