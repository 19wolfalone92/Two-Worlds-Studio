name: Freevideo — isolated T4 audit (CPU only)
on:
  push:
    branches:
      - research/freevideo-t4-adaptive-20261123
    paths:
      - 'experiments/freevideo_t4/**'
      - '.github/workflows/freevideo-t4-offline.yml'
  pull_request:
    paths:
      - 'experiments/freevideo_t4/**'
      - '.github/workflows/freevideo-t4-offline.yml'
permissions:
  contents: read

jobs:
  freevideo-offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only Studio Python package for bridge contract checks
        run: python -m pip install -e .
      - name: Ensure native frame validation tools are installed
        run: command -v ffmpeg && command -v ffprobe
      - name: Compile isolated Freevideo
        run: python -m compileall -q experiments/freevideo_t4
      - name: Run isolated Freevideo regression suite
        run: python -m unittest discover -s experiments/freevideo_t4 -p 'test_*.py' -v
      - name: Verify real Studio Wan2.2 I2V bridge accepts research parameters (NO GPU)
        run: |
          python -m studio.comfy_neural --help > /dev/null
          python - <<'PY'
          from studio.comfy_neural import wan22_workflow
          for w, h, frames, steps in [(432, 768, 25, 20), (576, 1024, 49, 36), (288, 512, 25, 16), (432, 768, 49, 32)]:
              graph = wan22_workflow(
                  "ref.png", "A complete person moves with natural stable anatomy",
                  42, width=w, height=h, frames=frames, steps=steps)
              assert graph["55"]["inputs"]["start_image"] == ["56", 0]
              assert graph["55"]["inputs"]["width"] == w
              assert graph["55"]["inputs"]["height"] == h
              assert graph["55"]["inputs"]["length"] == frames
              assert graph["3"]["inputs"]["steps"] == steps
              assert graph["58"]["class_type"] == "SaveVideo"
          PY
      - name: Simulation plan must remain explicitly unverified (NO GPU)
        run: |
          python experiments/freevideo_t4/adaptive_pipeline.py plan --simulate-t4 > /tmp/freevideo-plan.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/freevideo-plan.json"))
          assert d["status"] == "HEURISTIC_PLAN_NOT_BENCHMARKED"
          assert d["hardware"]["source"] == "simulated_not_executable"
          assert d["backend"] == "wan22-5b"
          PY
