name: TWO WORLDS - Kaggle API connection check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle-connection-check.yml"
      - ".github/workflows/kaggle-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-kaggle-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - name: Check that credentials were configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::The GitHub repository secret KAGGLE_API_TOKEN is missing or empty."
            exit 2
          fi
          if [[ -z "$KAGGLE_USERNAME" ]]; then
            echo "::error::The GitHub repository variable KAGGLE_USERNAME is missing or empty."
            exit 2
          fi
          if [[ ! "$KAGGLE_USERNAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Kaggle username has invalid characters."
            exit 2
          fi
          echo "Repository secret and username variable are both configured (token NOT displayed)."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle CLI
        run: python -m pip install "kaggle>=1.7"
      - name: Test read-only Kaggle API authentication without GPU
        shell: bash
        run: |
          set -euo pipefail
          # Use the API credentials for ONE read-only request, not for image generation.
          # Never display token, account response, or external resource details in Actions.
          kaggle kernels list --mine --page 1 >/dev/null
          echo "PASS: Kaggle CLI read-only API authentication succeeded."
      - name: Next step
        run: |
          echo "No GPU quota was used. To generate the first portrait, open"
          echo "Actions > TWO WORLDS - Manual Kaggle API GPU > Run workflow."
