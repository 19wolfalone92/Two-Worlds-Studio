name: FREEVIDEO - diagnose native aspect failure (read only)
on:
  push:
    branches: [research/freevideo-t4-adaptive-20261123]
    paths: ['.github/workflows/freevideo-native-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q 'kaggle==2.2.4' 'six>=1.16,<2'
          python -m studio.kaggle_identity --github-env "$GITHUB_ENV"
      - name: Retrieve only private diagnostic JSON and Comfy log
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/diag"
          kaggle kernels output "$KAGGLE_USERNAME/freevideo-hybrid-68adc8db5a9a" -p "$RUNNER_TEMP/diag" --file-pattern '^(freevideo_result[.]json|freevideo_progress[.]json|freevideo_private_comfy[.]log)$' --page-size 200 >/dev/null 2>&1
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'diag'
          d=json.loads((p/'freevideo_result.json').read_text())
          assert d['nonce']=='night-awakens-20261124-03'
          assert d['status']=='BLOCKED_GPU_NOT_VERIFIED'
          print('STAGE='+d['stage'])
          # Emit only fixed vocabulary, not arbitrary private backend content.
          sources=[d.get('error_summary',''),d.get('traceback_private','')]
          log=p/'freevideo_private_comfy.log'
          if log.is_file(): sources.append(log.read_text(errors='replace')[-200000:])
          terms=['Invalid native Wan2.2-5B I2V parameters','Reference must be opaque','Freevideo native reference must be 3:4','Generated video differs from planned geometry','ComfyUI did not produce requested native Wan2.2 frame clock','Studio bridge refused this run','ModuleNotFoundError','ImportError','NameError','TypeError','ValueError','RuntimeError','CUDA out of memory','out of memory','size mismatch','must be divisible','invalid shape','shape','dimension','No module named','GPU_QUARANTINED','timeout','No such file','Permission denied','mat1 and mat2 shapes cannot be multiplied','invalid prompt','prompt execution failed','execution_error','not enough values to unpack','not divisible','assertionerror','432','576','416','560','704','528','512','384']
          for i,s in enumerate(sources):
              print('DIAGNOSTIC_SOURCE='+str(i))
              for t in terms:
                  if t.lower() in s.lower(): print('MATCH='+t)
              for line in s.splitlines():
                  # Extract Python file basename and line number only.
                  m=re.search(r'File "[^"]*/([A-Za-z0-9_]+[.]py)", line ([0-9]+)',line)
                  if m: print('FRAME='+m[1]+':'+m[2])
          PY
