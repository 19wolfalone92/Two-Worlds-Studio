plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.wolf.autopilot'
    compileSdk 35
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId 'ai.wolf.autopilot'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    androidResources {
        noCompress += ['gguf']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
