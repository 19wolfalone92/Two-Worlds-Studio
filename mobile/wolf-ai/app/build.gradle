plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.wolf.autopilot'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.wolf.autopilot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
